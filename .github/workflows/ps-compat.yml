name: PowerShell compatibility

# A fresh Windows machine (and Claude Code's shell on Windows) runs Windows
# PowerShell 5.1, not pwsh 7 -- and 00-prereqs.ps1 is what *installs* pwsh 7.
# So every script here must parse under 5.1 or the whole runbook is unreachable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parse-5-1:
    name: Parse under Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report host version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()

      - name: Every .ps1 must parse under 5.1
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
              $errs = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errs)
              if ($errs.Count) {
                  $failed += $_.FullName
                  Write-Host "FAIL $($_.FullName)"
                  $errs | Select-Object -First 5 | ForEach-Object {
                      Write-Host "    line $($_.Extent.StartLineNumber): $($_.Message)"
                  }
              }
              else { Write-Host "ok   $($_.Name)" }
          }
          if ($failed.Count) {
              Write-Host ''
              Write-Host "$($failed.Count) script(s) do not parse under Windows PowerShell 5.1."
              Write-Host 'Common causes: the ternary (a ? b : c) and null-coalescing (??) operators'
              Write-Host 'are pwsh 7 only, and a non-ASCII char in a BOM-less file is decoded as'
              Write-Host 'CP1252 -- an em dash becomes U+201D, which PowerShell treats as a quote.'
              exit 1
          }

      - name: Non-ASCII .ps1 files must carry a UTF-8 BOM
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and
                        $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $nonAscii = @($bytes | Where-Object { $_ -gt 127 }).Count
              if ($nonAscii -gt 0 -and -not $hasBom) {
                  $bad += $_.FullName
                  Write-Host "FAIL $($_.FullName) ($nonAscii non-ASCII bytes, no BOM)"
              }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Windows PowerShell 5.1 reads BOM-less .ps1 as the ANSI codepage.'
              Write-Host 'Save these as UTF-8 with BOM (pwsh 7 reads that fine too).'
              exit 1
          }
          Write-Host 'All .ps1 files are ASCII-only or carry a UTF-8 BOM.'

      # $LASTEXITCODE is written by NATIVE commands only. A .ps1 that succeeds by running off
      # the end leaves it holding whatever the last native command set -- so a caller that
      # gates on it reads a stale value and cannot tell success from failure. Every runnable
      # script must therefore end with an explicit `exit`. Files starting with _ are
      # dot-sourced libraries, not entry points, and are exempt.
      - name: Every runnable .ps1 must end with an explicit exit
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
              Where-Object { $_.Name -notlike '_*' } | ForEach-Object {
              $lines = @(Get-Content $_.FullName | Where-Object { $_.Trim() -ne '' })
              if ($lines.Count -eq 0) { return }
              if ($lines[-1].Trim() -notmatch '^exit\s+\d+$') {
                  $bad += $_.FullName
                  Write-Host "FAIL $($_.Name) ends with: $($lines[-1].Trim())"
              }
              else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host "$($bad.Count) script(s) do not end with an explicit exit."
              Write-Host 'Append `exit 0` so callers can judge the run by $LASTEXITCODE.'
              exit 1
          }

      # The workflows themselves contain a lot of PowerShell that the *.ps1 checks above
      # never see, and `shell: powershell` is 5.1 too -- a ternary in a workflow fails
      # exactly the same way, just later and only in CI.
      - name: Inline workflow PowerShell must parse under 5.1
        shell: powershell
        run: |
          $bad = @()
          $script:scanned = 0
          Get-ChildItem .github\workflows -Filter *.yml -File | ForEach-Object {
              $wf = $_.Name
              # Crude but dependency-free: take every `run:` value -- block scalar OR
              # one-liner -- that a `shell: powershell` line applies to. Good enough to
              # catch pwsh-7-only syntax.
              $lines = Get-Content $_.FullName
              $before = $script:scanned
              function Test-Block($wf, $start, $text, [ref]$bad) {
                  # Strip GitHub expression interpolations before parsing: they are
                  # substituted before the shell ever sees them, and their contents are not
                  # PowerShell. (Deliberately not writing that syntax out literally here --
                  # Actions evaluates it ANYWHERE in the file, comments inside run: blocks
                  # included, and an invalid one makes the whole workflow unparseable.)
                  $clean = [regex]::Replace($text, '\$\{\{[^}]*\}\}', 'EXPR')
                  $errs = $null
                  $null = [System.Management.Automation.Language.Parser]::ParseInput($clean, [ref]$null, [ref]$errs)
                  if ($errs.Count) {
                      $bad.Value += "$wf line $start"
                      Write-Host "FAIL $wf (block at line $start): $($errs[0].Message)"
                  }
              }
              # Blocks are collected per STEP and tested only when the step ends. `run:` and
              # `shell:` are two keys of one mapping, so either order is valid YAML and means
              # the same thing -- testing a block the instant it closed required shell: to
              # have been read first, and silently skipped any step that wrote run: first.
              function Test-Pending($wf, $blocks, $isPs, [ref]$bad) {
                  if (-not $isPs) { return }
                  foreach ($b in $blocks) {
                      if (-not $b.Text.Trim()) { continue }
                      $script:scanned++
                      Test-Block $wf $b.Start $b.Text $bad
                  }
              }
              $pending = @(); $isPs = $false
              $inRun = $false; $indent = 0; $buf = @(); $blockStart = 0
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  $line = $lines[$i]
                  if ($inRun) {
                      $cur = $line.Length - $line.TrimStart().Length
                      if ($line.Trim() -eq '' -or $cur -ge $indent) { $buf += $line; continue }
                      $pending += [pscustomobject]@{ Start = $blockStart; Text = ($buf -join "`n") }
                      $inRun = $false; $buf = @()
                  }
                  # Reached here, a list item is outside any run: block, so it opens a new
                  # step: judge what the finished one collected, then start over.
                  if ($line -match '^\s*-\s') {
                      Test-Pending $wf $pending $isPs ([ref]$bad)
                      $pending = @(); $isPs = $false
                  }
                  if ($line -match '^\s*shell:\s*powershell\s*$') { $isPs = $true }
                  if ($line -match '^(\s*)run:\s*\|') {
                      $inRun = $true; $indent = $Matches[1].Length + 2; $buf = @(); $blockStart = $i + 1
                  }
                  elseif ($line -match '^\s*run:\s*([^|>\s].*)$') {
                      # A single-line `run:` value, which this scanner used to ignore
                      # entirely -- so the step that actually invokes 30-ghidra.ps1 and the
                      # one-liner at the top of this file were both unchecked.
                      $pending += [pscustomobject]@{ Start = ($i + 1); Text = $Matches[1] }
                  }
              }
              if ($inRun) { $pending += [pscustomobject]@{ Start = $blockStart; Text = ($buf -join "`n") } }
              Test-Pending $wf $pending $isPs ([ref]$bad)
              Write-Host ("  {0,-22} {1} block(s)" -f $wf, ($script:scanned - $before))
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Inline workflow PowerShell must be 5.1-compatible (no ternary, no ??).'
              exit 1
          }
          # A floor on how much was actually scanned. The heuristics above are matched
          # against YAML text, so they can quietly stop matching -- and with nothing to
          # scan this step printed its success line over an EMPTY scan, a check that passes
          # because it checked nothing. Measured on this repo 2026-08-20: 33 blocks across
          # the four workflow files (the per-file tally above is where that came from). The
          # floor sits nine under it so ordinary step churn never turns CI red, while the
          # failure this guards -- the run:/shell: matching breaking and the scan
          # collapsing toward zero -- lands far below it.
          $floor = 24
          if ($script:scanned -lt $floor) {
              Write-Host ''
              Write-Host "Only $($script:scanned) inline PowerShell block(s) scanned; expected at least $floor."
              Write-Host 'The run:/shell: matching above has stopped finding this repo. Fix the scan --'
              Write-Host 'lowering the floor instead just restores a check that checks nothing.'
              exit 1
          }
          Write-Host "Inline workflow PowerShell parses under 5.1 ($($script:scanned) block(s) scanned)."

      # GitHub evaluates its expression interpolations ANYWHERE in a workflow file --
      # including inside a run: block, and including a comment inside that block. One
      # invalid interpolation does not fail a step, it makes the whole workflow
      # unparseable, and the only feedback is "This run likely failed because of a
      # workflow file issue" with no line number. Assert every interpolation names a real
      # context or function. (This file never writes that syntax literally, which is why
      # the patterns below are escaped -- an unescaped one here would be evaluated too.)
      - name: Workflow expression interpolations must be valid
        shell: powershell
        run: |
          $open = '\$\{\{'
          $bad = @()
          Get-ChildItem .github\workflows -Filter *.yml -File | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              foreach ($m in [regex]::Matches($text, "$open(.*?)\}\}")) {
                  $expr = $m.Groups[1].Value.Trim()
                  # Valid roots per GitHub's contexts + the functions used in expressions.
                  $ok = $expr -match '^[!\s]*(github|matrix|steps|runner|job|jobs|env|secrets|inputs|needs|vars|strategy)\.' -or
                        $expr -match '^[!\s]*(always|failure|success|cancelled|hashFiles|contains|startsWith|endsWith|format|join|toJSON|fromJSON)\('
                  if (-not $ok) {
                      $line = ($text.Substring(0, $m.Index) -split "`n").Count
                      $bad += "$($_.Name):$line"
                      Write-Host "FAIL $($_.Name) line ${line}: not a valid expression -> $expr"
                  }
              }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Fix or reword these; a placeholder inside a comment still gets evaluated.'
              exit 1
          }
          Write-Host 'All workflow expression interpolations reference a real context.'

      # Smoke test: these must EXECUTE, not merely parse. A bare runner is missing most
      # components, so a non-zero exit is expected and fine -- we only fail on a thrown
      # error (a real scripting bug). Exactly ONE thrown message is tolerated: winget is
      # absent from some runner images and 00-prereqs.ps1 correctly throws
      # 'winget is not available. Install "App Installer" ...' when it is.
      #
      # That tolerance is matched against the MESSAGE, never blanket. It used to be a
      # -AllowThrow switch that swallowed every exception, which made this step physically
      # incapable of failing on 00-prereqs.ps1: a typo'd cmdlet, a null method call, a
      # crash on line 1 all printed "threw (tolerated)" and left the step green. The script
      # that installs everything on a fresh machine had zero enforceable coverage.
      - name: Setup scripts run their -CheckOnly path
        shell: powershell
        run: |
          $hardFail = $false
          function Smoke([string]$label, [scriptblock]$body, [string]$TolerateMessage) {
              Write-Host "=== $label ==="
              try { & $body; Write-Host "$label exit=$LASTEXITCODE (non-zero is expected on CI)" }
              catch {
                  # Print the message on BOTH paths: a tolerated throw that quietly stopped
                  # matching what the script actually says is how this rots back into a
                  # blanket catch, and the log is where that gets noticed.
                  $msg = $_.Exception.Message
                  if ($TolerateMessage -and $msg -match $TolerateMessage) {
                      Write-Host "$label threw (tolerated, expected on a runner without winget): $msg"
                  }
                  else { Write-Host "$label THREW: $msg"; $script:hardFail = $true }
              }
          }
          Smoke '00-prereqs -CheckOnly' { .\setup\00-prereqs.ps1 -CheckOnly } 'winget is not available'
          Smoke '10-vcpkg -CheckOnly'   { .\setup\10-vcpkg.ps1 -CheckOnly -VcpkgDir "$env:RUNNER_TEMP\vcpkg" }
          Smoke '90-verify'             { .\setup\90-verify.ps1 }
          if ($hardFail) { Write-Host ''; Write-Host 'A setup script threw.'; exit 1 }
          exit 0
