name: PowerShell compatibility

# A fresh Windows machine (and Claude Code's shell on Windows) runs Windows
# PowerShell 5.1, not pwsh 7 -- and 00-prereqs.ps1 is what *installs* pwsh 7.
# So every script here must parse under 5.1 or the whole runbook is unreachable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parse-5-1:
    name: Parse under Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report host version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()

      # Two AST lints ride along with the parse instead of getting a step each, because this is
      # already the only place that reads every .ps1 -- a second walker would drift out of step
      # with this one about which files it even covers. Both target a class this repo has
      # regrown AFTER being fixed once, with two or more confirmed instances each; that, not
      # general strictness, is what makes a query worth running on every push.
      #
      # LINT A -- the return-bypass class. A `return` with no enclosing function leaves the
      # SCRIPT, skipping the explicit `exit` the step below insists on. 10-vcpkg.ps1 shipped
      # exactly that: its -NoEnv branch returned, so a fully successful run reported whatever
      # the last native command had left in $LASTEXITCODE -- measured 128 on a tag-pinned
      # clone, which every caller gating on that value reads as a hard failure. A `return`
      # inside a ForEach-Object/Where-Object block is a different statement (it ends that
      # iteration, not the script) and is deliberately NOT flagged: 30-ghidra.ps1's
      # busy-JVM filter is built on it. Files starting with _ are dot-sourced and have no
      # exit contract, so they are exempt.
      #
      # LINT B -- the naked file write class. With no -Encoding, none of these four writes UTF-8,
      # and none writes the same bytes on 5.1 as on pwsh 7. Get-Content, Set-Content and
      # Add-Content use the machine's ANSI codepage; Out-File uses UTF-16LE with a BOM -- measured
      # on 5.1, `Out-File` gives FF FE 61 00 where `Set-Content` gives 61 62 63 -- so it is a
      # different wrong answer, not the same one, and naming only ANSI here would leave the next
      # maintainer thinking Out-File was covered by accident.
      # On cp1252 the ANSI round-trip is byte-preserving and hides; on a DBCS locale it corrupts, which is how
      # New-Plugin.ps1 produced a CMakeUserPresets.json that cmake 3.31.6 accepted with rc=0
      # while creating a deploy directory with U+FFFD in its name. A hosted runner cannot
      # change its system codepage, so that corruption can never be REPRODUCED in CI -- an AST
      # query is the only form in which this class is catchable here at all. -Encoding ascii is
      # a real answer and stays one (36-ghidra-mcp.ps1 writes its PID record that way on
      # purpose); -Encoding Default and -Encoding OEM are the ANSI codepage with a parameter in
      # front of it, and are refused.
      - name: Every .ps1 must parse under 5.1, then the two AST recurrence lints
        shell: powershell
        run: |
          $failed = @()
          $lintFail = @()

          # The three allowlists below are per FILE and per COUNT, and they are CEILINGS, not
          # blessings: a new occurrence -- in a listed file above its number, or in any file
          # not listed at all -- fails this step. Every entry names a defect that predates the
          # lint so it can be closed, and none of them is an exemption anyone argued for.
          # Counts measured on this tree 2026-08-22. Falling BELOW a number only prints
          # TIGHTEN and never fails, so landing a repair cannot turn CI red on the person who
          # landed it; the entry is meant to come down in that same change. An entry naming a
          # file that is not in the tree DOES fail, because an allowlist nobody can audit
          # against a real file is how one starts growing quietly.
          $knownBareReturn = @{
              # The SkyrimNG branch prints "use your existing template" and returns, so the one
              # outcome that is normal and expected is also the only one that never reaches the
              # `exit 0` at the bottom -- the 10-vcpkg.ps1 bug verbatim, in a second file.
              'New-Plugin.ps1' = 1
          }
          # Empty, and that is the shipped state, not an oversight: no .ps1 in this tree writes a
          # file through these cmdlets without an encoding any more. The four that did -- the
          # scaffold token rewrite, the vcpkg manifest rewrite and CMakeUserPresets.json in
          # New-Plugin.ps1 -- were repaired in the same batch as this lint, so the write half is
          # enforcing at zero everywhere. Anything landing in here later has to arrive with a
          # reason next to it, in a diff, which is the only way an allowlist stays honest.
          $bareWriteAllowed = @{}
          # Reads are grandfathered, writes are not, because the two fail differently: a bad read
          # produces a wrong value in one process, a bad write leaves wrong bytes on disk for
          # everything that opens the file afterwards. All 19 below are Get-Content, and each
          # reads either an ASCII file or JSON this pack wrote itself with a BOM 5.1 detects --
          # which is why they have not bitten yet, not a reason they cannot.
          $bareReadAllowed = @{
              'setup\30-ghidra.ps1'          = 1   # Ghidra's own application.properties, ASCII in practice
              'setup\35-ghidra-analysis.ps1' = 2   # tailing the headless run/import logs
              'setup\36-ghidra-mcp.ps1'      = 10  # 5 manifest/PID/lock reads + 5 log tails
              'setup\90-verify.ps1'          = 3   # JSON this pack wrote itself, so BOM-detected
              'setup\_common.ps1'            = 3   # same
          }
          # Encodings that name a fixed byte mapping, so the result does not depend on which
          # codepage the machine happens to be set to. Default/OEM/String/Unknown are missing on
          # purpose: those ARE the ANSI/OEM codepage. utf8BOM and utf8NoBOM are missing because
          # they are pwsh 7 spellings that throw under 5.1, which is this file's whole subject.
          $okEncoding = @('ascii', 'bigendianunicode', 'byte', 'unicode', 'utf32', 'utf7', 'utf8')
          # Aliases included: gc/cat/type/sc/ac reach the same cmdlets and the same default.
          $ioCmds = @('get-content', 'set-content', 'out-file', 'add-content', 'gc', 'cat', 'type', 'sc', 'ac')
          $writeCmds = @('set-content', 'out-file', 'add-content', 'sc', 'ac')

          $seenReturn = @{}; $seenWrite = @{}; $seenRead = @{}
          $isReturn = { param($n) $n -is [System.Management.Automation.Language.ReturnStatementAst] }
          $isCommand = { param($n) $n -is [System.Management.Automation.Language.CommandAst] }

          $lintRoot = (Get-Location).Path
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
              # Key on the REPO-RELATIVE PATH, not the leaf. Two .ps1 with the same file name in
              # different directories otherwise share one bucket and the last one enumerated
              # silently overwrites the first -- Get-ChildItem -Recurse walks root-level
              # directories alphabetically, so anything sorting before setup\ is erased. Measured:
              # an aaa\90-verify.ps1 carrying two naked Set-Content calls made this step PRINT
              # both of them and then declare itself clean, exit 0. A check that reports a defect
              # and passes anyway is the exact shape this review exists to remove, and it matters
              # here because the repo ships a templates\ tree meant to be copied.
              $name = $_.FullName.Substring($lintRoot.Length).TrimStart('\', '/')
              $leaf = $_.Name
              $errs = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errs)
              if ($errs.Count) {
                  $failed += $_.FullName
                  Write-Host "FAIL $($_.FullName)"
                  $errs | Select-Object -First 5 | ForEach-Object {
                      Write-Host "    line $($_.Extent.StartLineNumber): $($_.Message)"
                  }
                  # A file that did not parse has no usable AST, so it contributes no lint
                  # counts -- which is why the parse verdict is returned before them below.
                  return
              }
              Write-Host "ok   $name"

              # The dot-sourced-library exemption is about the FILE NAME, so it uses the leaf --
              # $name is now a path and would never match '_*' for anything under a directory.
              if ($leaf -notlike '_*') {
                  $n = 0
                  foreach ($r in $ast.FindAll($isReturn, $true)) {
                      # Walk out to the root. The FIRST scope-forming ancestor decides it: a
                      # function or a script block passed to a cmdlet both catch the return,
                      # while if/else/try bodies do not and let it leave the script.
                      $p = $r.Parent; $scoped = $false
                      while ($p) {
                          if ($p -is [System.Management.Automation.Language.FunctionDefinitionAst] -or
                              $p -is [System.Management.Automation.Language.ScriptBlockExpressionAst]) {
                              $scoped = $true; break
                          }
                          $p = $p.Parent
                      }
                      if ($scoped) { continue }
                      $n++
                      Write-Host "     return-bypass $($name):$($r.Extent.StartLineNumber)  $($r.Extent.Text.Trim())"
                  }
                  $seenReturn[$name] = $n
              }

              $w = 0; $rd = 0
              foreach ($c in $ast.FindAll($isCommand, $true)) {
                  $cn = $c.GetCommandName()
                  if (-not $cn) { continue }
                  # Strip a module qualifier before matching. GetCommandName() returns exactly
                  # what was written, so `Microsoft.PowerShell.Management\Set-Content` compared
                  # whole-string against the list matched nothing and escaped the lint entirely
                  # (measured). Fully-qualified calls are rare but legal, and a lint with a
                  # trivially-written bypass is worth less than no lint.
                  $cn = ($cn -split '\\')[-1].ToLower()
                  if ($ioCmds -notcontains $cn) { continue }
                  $hasEnc = $false; $encArg = ''
                  for ($i = 1; $i -lt $c.CommandElements.Count; $i++) {
                      $e = $c.CommandElements[$i]
                      if ($e -isnot [System.Management.Automation.Language.CommandParameterAst]) { continue }
                      # Match how PowerShell binds it, not how it is spelled: -Enc is the same
                      # parameter as -Encoding, and a lint that only knew the long form would
                      # bless the short one.
                      $pn = $e.ParameterName
                      if ($pn.Length -lt 3) { continue }
                      if (-not 'Encoding'.StartsWith($pn, [StringComparison]::OrdinalIgnoreCase)) { continue }
                      $hasEnc = $true
                      if ($e.Argument) { $encArg = $e.Argument.Extent.Text }
                      elseif (($i + 1) -lt $c.CommandElements.Count) { $encArg = $c.CommandElements[$i + 1].Extent.Text }
                  }
                  $ln = $c.Extent.StartLineNumber
                  if ($hasEnc) {
                      $v = $encArg.Trim().Trim("'", '"').ToLower()
                      if ($okEncoding -notcontains $v) {
                          # No allowlist for this one: it is always wrong, and it has never
                          # appeared here, so grandfathering it would be inventing a debt.
                          $lintFail += "bad-encoding $($name):$ln"
                          Write-Host "     FAIL $($name):$ln  $cn -Encoding $encArg does not name a fixed byte mapping"
                      }
                      continue
                  }
                  if ($writeCmds -contains $cn) { $w++ } else { $rd++ }
                  Write-Host "     no -Encoding $($name):$ln  $cn"
              }
              $seenWrite[$name] = $w
              $seenRead[$name] = $rd
          }

          if ($failed.Count) {
              Write-Host ''
              Write-Host "$($failed.Count) script(s) do not parse under Windows PowerShell 5.1."
              Write-Host 'Common causes: the ternary (a ? b : c) and null-coalescing (??) operators'
              Write-Host 'are pwsh 7 only, and a non-ASCII char in a BOM-less file is decoded as'
              Write-Host 'CP1252 -- an em dash becomes U+201D, which PowerShell treats as a quote.'
              exit 1
          }

          function Test-Budget($label, $seen, $allowed, [ref]$fail) {
              foreach ($k in $seen.Keys) {
                  $cap = 0
                  if ($allowed.ContainsKey($k)) { $cap = $allowed[$k] }
                  if ($seen[$k] -gt $cap) {
                      $fail.Value += "$label $k"
                      Write-Host "FAIL $label -- $k has $($seen[$k]), its allowlist entry permits $cap"
                  }
                  elseif ($seen[$k] -lt $cap) {
                      Write-Host "TIGHTEN $label -- $k is down to $($seen[$k]); lower its allowlist entry to that, or drop it"
                  }
              }
              foreach ($k in $allowed.Keys) {
                  if (-not $seen.ContainsKey($k)) {
                      $fail.Value += "$label allowlist entry $k"
                      Write-Host "FAIL $label -- allowlist entry '$k' matches no .ps1 in the tree; delete it"
                  }
              }
          }
          Test-Budget 'return-bypass' $seenReturn $knownBareReturn ([ref]$lintFail)
          Test-Budget 'bare write' $seenWrite $bareWriteAllowed ([ref]$lintFail)
          Test-Budget 'bare read' $seenRead $bareReadAllowed ([ref]$lintFail)

          if ($lintFail.Count) {
              Write-Host ''
              if (@($lintFail | Where-Object { $_ -like 'return-bypass*' }).Count) {
                  Write-Host 'A return outside any function leaves the SCRIPT, skipping the trailing exit, so'
                  Write-Host 'the caller reads a stale $LASTEXITCODE. Guard the block with if/else, or exit N.'
              }
              if (@($lintFail | Where-Object { $_ -notlike 'return-bypass*' }).Count) {
                  Write-Host "Pass -Encoding explicitly. Accepted: $($okEncoding -join ', ')."
                  Write-Host 'For a file another tool must read as UTF-8, prefer [IO.File]::WriteAllText with'
                  Write-Host '[Text.UTF8Encoding]::new($false) -- it is the only way to get UTF-8 with no BOM'
                  Write-Host 'out of 5.1, and JSON parsers are entitled to reject a BOM before the brace.'
              }
              Write-Host 'Raising a number in the allowlist is not the fix for any of these; it is the finding.'
              exit 1
          }
          Write-Host ''
          Write-Host 'Both AST recurrence lints are clean against their allowlists.'

      - name: Non-ASCII .ps1 files must carry a UTF-8 BOM
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and
                        $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $nonAscii = @($bytes | Where-Object { $_ -gt 127 }).Count
              if ($nonAscii -gt 0 -and -not $hasBom) {
                  $bad += $_.FullName
                  Write-Host "FAIL $($_.FullName) ($nonAscii non-ASCII bytes, no BOM)"
              }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Windows PowerShell 5.1 reads BOM-less .ps1 as the ANSI codepage.'
              Write-Host 'Save these as UTF-8 with BOM (pwsh 7 reads that fine too).'
              exit 1
          }
          Write-Host 'All .ps1 files are ASCII-only or carry a UTF-8 BOM.'

      # $LASTEXITCODE is written by NATIVE commands only. A .ps1 that succeeds by running off
      # the end leaves it holding whatever the last native command set -- so a caller that
      # gates on it reads a stale value and cannot tell success from failure. Every runnable
      # script must therefore end with an explicit `exit`. Files starting with _ are
      # dot-sourced libraries, not entry points, and are exempt.
      - name: Every runnable .ps1 must end with an explicit exit
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
              Where-Object { $_.Name -notlike '_*' } | ForEach-Object {
              $lines = @(Get-Content $_.FullName | Where-Object { $_.Trim() -ne '' })
              if ($lines.Count -eq 0) { return }
              if ($lines[-1].Trim() -notmatch '^exit\s+\d+$') {
                  $bad += $_.FullName
                  Write-Host "FAIL $($_.Name) ends with: $($lines[-1].Trim())"
              }
              else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host "$($bad.Count) script(s) do not end with an explicit exit."
              Write-Host 'Append `exit 0` so callers can judge the run by $LASTEXITCODE.'
              exit 1
          }

      # The workflows themselves contain a lot of PowerShell that the *.ps1 checks above
      # never see, and `shell: powershell` is 5.1 too -- a ternary in a workflow fails
      # exactly the same way, just later and only in CI.
      - name: Inline workflow PowerShell must parse under 5.1
        shell: powershell
        run: |
          $bad = @()
          $script:scanned = 0
          Get-ChildItem .github\workflows -Filter *.yml -File | ForEach-Object {
              $wf = $_.Name
              # Crude but dependency-free: take every `run:` value -- block scalar OR
              # one-liner -- that a `shell: powershell` line applies to. Good enough to
              # catch pwsh-7-only syntax.
              $lines = Get-Content $_.FullName
              $before = $script:scanned
              function Test-Block($wf, $start, $text, [ref]$bad) {
                  # Strip GitHub expression interpolations before parsing: they are
                  # substituted before the shell ever sees them, and their contents are not
                  # PowerShell. (Deliberately not writing that syntax out literally here --
                  # Actions evaluates it ANYWHERE in the file, comments inside run: blocks
                  # included, and an invalid one makes the whole workflow unparseable.)
                  $clean = [regex]::Replace($text, '\$\{\{[^}]*\}\}', 'EXPR')
                  $errs = $null
                  $null = [System.Management.Automation.Language.Parser]::ParseInput($clean, [ref]$null, [ref]$errs)
                  if ($errs.Count) {
                      $bad.Value += "$wf line $start"
                      Write-Host "FAIL $wf (block at line $start): $($errs[0].Message)"
                  }
              }
              # Blocks are collected per STEP and tested only when the step ends. `run:` and
              # `shell:` are two keys of one mapping, so either order is valid YAML and means
              # the same thing -- testing a block the instant it closed required shell: to
              # have been read first, and silently skipped any step that wrote run: first.
              function Test-Pending($wf, $blocks, $isPs, [ref]$bad) {
                  if (-not $isPs) { return }
                  foreach ($b in $blocks) {
                      if (-not $b.Text.Trim()) { continue }
                      $script:scanned++
                      Test-Block $wf $b.Start $b.Text $bad
                  }
              }
              $pending = @(); $isPs = $false
              $inRun = $false; $indent = 0; $buf = @(); $blockStart = 0
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  $line = $lines[$i]
                  if ($inRun) {
                      $cur = $line.Length - $line.TrimStart().Length
                      if ($line.Trim() -eq '' -or $cur -ge $indent) { $buf += $line; continue }
                      $pending += [pscustomobject]@{ Start = $blockStart; Text = ($buf -join "`n") }
                      $inRun = $false; $buf = @()
                  }
                  # Reached here, a list item is outside any run: block, so it opens a new
                  # step: judge what the finished one collected, then start over.
                  if ($line -match '^\s*-\s') {
                      Test-Pending $wf $pending $isPs ([ref]$bad)
                      $pending = @(); $isPs = $false
                  }
                  if ($line -match '^\s*shell:\s*powershell\s*$') { $isPs = $true }
                  if ($line -match '^(\s*)run:\s*\|') {
                      $inRun = $true; $indent = $Matches[1].Length + 2; $buf = @(); $blockStart = $i + 1
                  }
                  elseif ($line -match '^\s*run:\s*([^|>\s].*)$') {
                      # A single-line `run:` value, which this scanner used to ignore
                      # entirely -- so the step that actually invokes 30-ghidra.ps1 and the
                      # one-liner at the top of this file were both unchecked.
                      $pending += [pscustomobject]@{ Start = ($i + 1); Text = $Matches[1] }
                  }
              }
              if ($inRun) { $pending += [pscustomobject]@{ Start = $blockStart; Text = ($buf -join "`n") } }
              Test-Pending $wf $pending $isPs ([ref]$bad)
              Write-Host ("  {0,-22} {1} block(s)" -f $wf, ($script:scanned - $before))
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Inline workflow PowerShell must be 5.1-compatible (no ternary, no ??).'
              exit 1
          }
          # A floor on how much was actually scanned. The heuristics above are matched
          # against YAML text, so they can quietly stop matching -- and with nothing to
          # scan this step printed its success line over an EMPTY scan, a check that passes
          # because it checked nothing. Measured on this repo 2026-08-20: 33 blocks across
          # the four workflow files (the per-file tally above is where that came from). The
          # floor sits nine under it so ordinary step churn never turns CI red, while the
          # failure this guards -- the run:/shell: matching breaking and the scan
          # collapsing toward zero -- lands far below it.
          $floor = 24
          if ($script:scanned -lt $floor) {
              Write-Host ''
              Write-Host "Only $($script:scanned) inline PowerShell block(s) scanned; expected at least $floor."
              Write-Host 'The run:/shell: matching above has stopped finding this repo. Fix the scan --'
              Write-Host 'lowering the floor instead just restores a check that checks nothing.'
              exit 1
          }
          Write-Host "Inline workflow PowerShell parses under 5.1 ($($script:scanned) block(s) scanned)."

      # GitHub evaluates its expression interpolations ANYWHERE in a workflow file --
      # including inside a run: block, and including a comment inside that block. One
      # invalid interpolation does not fail a step, it makes the whole workflow
      # unparseable, and the only feedback is "This run likely failed because of a
      # workflow file issue" with no line number. Assert every interpolation names a real
      # context or function. (This file never writes that syntax literally, which is why
      # the patterns below are escaped -- an unescaped one here would be evaluated too.)
      - name: Workflow expression interpolations must be valid
        shell: powershell
        run: |
          $open = '\$\{\{'
          $bad = @()
          Get-ChildItem .github\workflows -Filter *.yml -File | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              foreach ($m in [regex]::Matches($text, "$open(.*?)\}\}")) {
                  $expr = $m.Groups[1].Value.Trim()
                  # Valid roots per GitHub's contexts + the functions used in expressions.
                  $ok = $expr -match '^[!\s]*(github|matrix|steps|runner|job|jobs|env|secrets|inputs|needs|vars|strategy)\.' -or
                        $expr -match '^[!\s]*(always|failure|success|cancelled|hashFiles|contains|startsWith|endsWith|format|join|toJSON|fromJSON)\('
                  if (-not $ok) {
                      $line = ($text.Substring(0, $m.Index) -split "`n").Count
                      $bad += "$($_.Name):$line"
                      Write-Host "FAIL $($_.Name) line ${line}: not a valid expression -> $expr"
                  }
              }
          }
          if ($bad.Count) {
              Write-Host ''
              Write-Host 'Fix or reword these; a placeholder inside a comment still gets evaluated.'
              exit 1
          }
          Write-Host 'All workflow expression interpolations reference a real context.'

      # Smoke test: these must EXECUTE, not merely parse. A bare runner is missing most
      # components, so a non-zero exit is expected and fine -- we only fail on a thrown
      # error (a real scripting bug). Exactly ONE thrown message is tolerated: winget is
      # absent from some runner images and 00-prereqs.ps1 correctly throws
      # 'winget is not available. Install "App Installer" ...' when it is.
      #
      # That tolerance is matched against the MESSAGE, never blanket. It used to be a
      # -AllowThrow switch that swallowed every exception, which made this step physically
      # incapable of failing on 00-prereqs.ps1: a typo'd cmdlet, a null method call, a
      # crash on line 1 all printed "threw (tolerated)" and left the step green. The script
      # that installs everything on a fresh machine had zero enforceable coverage.
      - name: Setup scripts run their -CheckOnly path
        shell: powershell
        run: |
          $hardFail = $false
          function Smoke([string]$label, [scriptblock]$body, [string]$TolerateMessage) {
              Write-Host "=== $label ==="
              try { & $body; Write-Host "$label exit=$LASTEXITCODE (non-zero is expected on CI)" }
              catch {
                  # Print the message on BOTH paths: a tolerated throw that quietly stopped
                  # matching what the script actually says is how this rots back into a
                  # blanket catch, and the log is where that gets noticed.
                  $msg = $_.Exception.Message
                  if ($TolerateMessage -and $msg -match $TolerateMessage) {
                      Write-Host "$label threw (tolerated, expected on a runner without winget): $msg"
                  }
                  else { Write-Host "$label THREW: $msg"; $script:hardFail = $true }
              }
          }
          Smoke '00-prereqs -CheckOnly' { .\setup\00-prereqs.ps1 -CheckOnly } 'winget is not available'
          Smoke '10-vcpkg -CheckOnly'   { .\setup\10-vcpkg.ps1 -CheckOnly -VcpkgDir "$env:RUNNER_TEMP\vcpkg" }
          Smoke '90-verify'             { .\setup\90-verify.ps1 }
          if ($hardFail) { Write-Host ''; Write-Host 'A setup script threw.'; exit 1 }
          exit 0
