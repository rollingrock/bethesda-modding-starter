name: Ghidra MCP bringup

# Phase 4 is the part of this pack that kept breaking on a fresh machine, and every failure
# was quiet: a winget package that does not exist, an extension built for the wrong Ghidra
# version, a bridge that connects to nothing. This job runs the whole bringup on a clean
# runner and asserts the things that were silently wrong before.
#
# WHAT THIS CANNOT COVER, deliberately: the analysis itself. 35-ghidra-analysis.ps1 needs
# game executables staged under exes\<game>\<ver>\, and those come from the user's own game
# installs -- they cannot be downloaded, and a full Bethesda binary takes HOURS against a
# 6-hour job limit. So CI proves the bringup WORKS; only a real machine proves the database
# is GOOD. The naming numbers in CLAUDE.md stay hand-measured for that reason.
#
# What it does cover, with no game assets at all:
#   * setup/20-repos.ps1 clones ghidra-mcp -- the script that decides which fork and which
#     branch a user gets, which this workflow used to bypass with its own `git clone`
#   * gradlew builds the extension (no Maven -- there is no Apache.Maven package in winget)
#   * the version gate: extension.properties version == the install's application.version
#   * the headless server starts, serves its endpoints, and loads a program
#   * the .mcp.json -WriteMcpConfigTo generates: it parses, it names a bridge that is on this
#     machine, its URL is the port this run served, and BOTH servers are in it
#   * the BRIDGE registers tools against it -- the actual "an agent gets tools" contract,
#     which /mcp/schema answering does not by itself prove -- driven from that .mcp.json
#   * -Stop leaves no JVM behind (a killed one strands a project lock)
#   * 40-x64dbg.ps1 installs the debugger half of that .mcp.json, and repairs a tree broken
#     on purpose (a missing engine, a truncated plugin)
#
# And every script it runs, it runs TWICE. "Everything is idempotent; re-running a phase is
# safe" is the first promise CLAUDE.md makes and no workflow tested it, so a second run that
# re-cloned, rebuilt or rewrote what the first one had already produced was invisible here.
#
# This workflow runs ONE Ghidra version: 12.0.4, the known-good one this pack is verified
# against, and every failure here is a real failure that blocks the push or the PR.
#
# The drift check against Ghidra's `latest` release lives in its own file,
# ghidra-drift.yml. It used to ride along here as a second matrix leg carrying
# continue-on-error so upstream's release timing could never block a PR -- but
# continue-on-error means the leg cannot fail the RUN, and a failed run conclusion is the
# only thing GitHub emails about. So the detector detected and told nobody: it wrote the
# breakage into a step summary inside a green run that nobody opens. A separate scheduled
# workflow fails on its own, which notifies, and still cannot block a PR here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bringup:
    name: Bringup (Ghidra ${{ matrix.ghidra }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # A one-entry matrix on purpose: the version reaches the job name, the release
      # lookup, the cache key and the summary, so verifying the pack against the next
      # Ghidra is one line here instead of a find-and-replace. Nothing in this workflow
      # may carry continue-on-error -- that is precisely what left the old second leg
      # unable to fail the run.
      matrix:
        ghidra: ['12.0.4']

    steps:
      - uses: actions/checkout@v5

      # Ghidra 12 and the GhidraMCP build both need JDK 21+. Pin it rather than inherit
      # whatever the image ships, so a runner-image bump cannot silently change the JDK.
      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve the Ghidra release to install
        id: rel
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'bethesda-modding-starter-ci' }
          $api = 'https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100'
          $releases = Invoke-RestMethod $api -Headers $headers
          # Pinned tags only. Resolving Ghidra's `latest` release is ghidra-drift.yml's
          # job; if it stayed an option here, one matrix typo would quietly turn the leg
          # that gates PRs into a drift run against whatever shipped that morning.
          $rel = $releases | Where-Object { $_.tag_name -eq 'Ghidra_${{ matrix.ghidra }}_build' } | Select-Object -First 1
          if (-not $rel) { throw 'No matching Ghidra release for "${{ matrix.ghidra }}".' }
          $asset = $rel.assets | Where-Object { $_.name -like 'ghidra_*_PUBLIC_*.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Release $($rel.tag_name) has no ghidra_*_PUBLIC_*.zip asset." }
          # ghidra_12.0.4_PUBLIC_20260303.zip -> version 12.0.4, extracted dir ghidra_12.0.4_PUBLIC
          if ($asset.name -notmatch '^ghidra_([0-9.]+)_PUBLIC_') { throw "Cannot parse a version out of $($asset.name)." }
          $ver = $Matches[1]
          Write-Host "release  : $($rel.tag_name)"
          Write-Host "asset    : $($asset.name)  ($([math]::Round($asset.size/1MB)) MB)"
          Write-Host "version  : $ver"
          "version=$ver"              | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=$($asset.name)"      | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($asset.browser_download_url)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dir=C:\tools\ghidra_${ver}_PUBLIC"  | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ~400 MB per download; cache it so re-runs are cheap. The key is the asset name, so
      # ghidra-drift.yml's `latest` download gets its own entry instead of colliding here.
      - name: Cache the Ghidra install
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.rel.outputs.dir }}
          key: ghidra-${{ steps.rel.outputs.asset }}

      - name: Download + extract Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP '${{ steps.rel.outputs.asset }}'
          Write-Host 'Downloading ...'
          # Invoke-WebRequest's progress rendering costs minutes on a 400 MB file in CI.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest '${{ steps.rel.outputs.url }}' -OutFile $zip
          Write-Host 'Extracting ...'
          Expand-Archive $zip -DestinationPath C:\tools -Force
          Remove-Item $zip

      - name: Confirm the install looks like Ghidra
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $props = '${{ steps.rel.outputs.dir }}\Ghidra\application.properties'
          if (-not (Test-Path $props)) { throw "No application.properties under ${{ steps.rel.outputs.dir }}" }
          Get-Content $props | Select-String 'application.version|application.release.name'

      # ---------------------------------------------------------------- the pack's own script
      # 20-repos.ps1, not a hand-rolled clone. This step used to be its own `git clone` of
      # ghidra-mcp -- beside a 30-ghidra.ps1 that REFUSES to clone and tells the user to run
      # setup/20-repos.ps1 first -- so the one script that decides which fork and which branch
      # every user gets (ghidra-mcp, devbench, CommonLibF4, vr_address_tools) had zero execution
      # coverage and was only ever parse-checked. That is precisely the territory of the
      # devbench bug this pack already shipped once: feat/multigame-core cloned successfully,
      # every check stayed green, and the in-game server never started on the machine that got
      # it. -Only was added for this step; the full table pulls vr_address_tools, ~1.1 GB.
      - name: 20-repos.ps1 -Only ghidra-mcp (the script that pins the fork)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -CheckOnly first, on an empty C:\repos: 2 is "work pending", and it is the only
          # answer that proves this run really cloned something rather than finding it.
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp -CheckOnly
          if ($LASTEXITCODE -ne 2) { throw "-CheckOnly on an empty C:\repos exited $LASTEXITCODE; expected 2 (work pending)." }
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp
          if ($LASTEXITCODE -ne 0) { throw "20-repos.ps1 failed (exit $LASTEXITCODE)." }
          # Twice. The second run has to take the identity path -- origin matches the pinned
          # URL, so the clone is adopted, nothing is re-cloned and nothing is deleted -- and
          # still exit 0. A re-run that re-cloned, or that failed over the clone it had just
          # made, is "re-running a phase is safe" breaking in the cheapest place to see it.
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp
          if ($LASTEXITCODE -ne 0) { throw "the second 20-repos.ps1 run exited $LASTEXITCODE." }
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "-CheckOnly over the fresh clone exited $LASTEXITCODE; expected 0." }
          # -CheckOnly above is the gate; this line is what puts the answer in the log, because
          # "which fork, at which commit" is the first question a red run below raises.
          $origin = & git -C C:\repos\ghidra-mcp remote get-url origin
          if ($origin -ne 'https://github.com/bethington/ghidra-mcp.git') { throw "ghidra-mcp origin is $origin" }
          Write-Host "ghidra-mcp @ $(git -C C:\repos\ghidra-mcp rev-parse --short HEAD) from $origin"
          exit 0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/ghidra-bringup.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------------------------------------------------------------- build the extension
      - name: 30-ghidra.ps1 (build + deploy the extension, create the bridge venv)
        shell: powershell
        run: .\setup\30-ghidra.ps1 -GhidraPath '${{ steps.rel.outputs.dir }}'

      - name: Assert what 30-ghidra.ps1 claims it produced
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\setup\.ghidra-mcp-build.json'
          if (-not (Test-Path $manifest)) { throw 'No setup\.ghidra-mcp-build.json -- 30-ghidra.ps1 did not finish.' }
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          $m | Format-List

          # The version gate is the failure that produces an extension Ghidra silently will
          # not load, so assert it here too rather than trusting the script's own check.
          if ($m.ghidraVersion -ne '${{ steps.rel.outputs.version }}') {
              throw "Manifest says Ghidra $($m.ghidraVersion), we installed ${{ steps.rel.outputs.version }}."
          }
          foreach ($p in @($m.pluginJar, $m.bridgeExe, $m.headlessCpFile, $m.extensionZip)) {
              if (-not (Test-Path $p)) { throw "Missing artifact: $p" }
          }
          # The headless server cannot start without a real classpath; an empty or tiny
          # argfile is the kind of thing that only shows up as a NoClassDefFoundError later.
          $jars = ((Get-Content $m.headlessCpFile -Raw) -split ';').Count
          Write-Host "classpath entries: $jars"
          if ($jars -lt 50) { throw "Classpath argfile has only $jars entries; expected the full Ghidra jar set." }
          Write-Host 'All artifacts present.'

      # SECOND RUN. CLAUDE.md's opening paragraph promises "Everything is idempotent; re-running
      # a phase is safe", and until this step no workflow ran any phase twice -- the headline
      # claim of the whole runbook had zero coverage. The manifest is the cheapest place to hold
      # it: 30-ghidra.ps1 writes setup\.ghidra-mcp-build.json only when a field it records has
      # changed, so a re-run over an unchanged build must leave those bytes exactly as they were.
      # A second run that picked a different Ghidra, rebuilt the venv into a different path, or
      # rewrote the file for nothing lands here as a hash mismatch -- the skip-if-present class
      # caught live rather than by reading the code.
      - name: 30-ghidra.ps1 again -- a re-run must change nothing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\setup\.ghidra-mcp-build.json'
          $before = (Get-FileHash $manifest -Algorithm SHA256).Hash
          .\setup\30-ghidra.ps1 -GhidraPath '${{ steps.rel.outputs.dir }}'
          if ($LASTEXITCODE -ne 0) { throw "the second 30-ghidra.ps1 run exited $LASTEXITCODE." }
          $after = (Get-FileHash $manifest -Algorithm SHA256).Hash
          if ($after -ne $before) {
              Write-Host "before: $before"
              Write-Host "after : $after"
              Get-Content $manifest -Encoding UTF8
              throw 'The second run rewrote setup\.ghidra-mcp-build.json. A re-run over an unchanged build must leave it byte-identical.'
          }
          Write-Host "Manifest unchanged across two runs (sha256 $before)."
          exit 0

      # ---------------------------------------------------------------- headless server
      # ONE step on purpose. A background process does NOT survive the step that started
      # it on a Windows runner -- the runner tears down the step's process tree, so a
      # server started in step N is already gone in step N+1. Measured: -Start reported
      # "HTTP server started on 127.0.0.1:8089" and the very next step got "Unable to
      # connect to the remote server", with the server's own log ending cleanly (no crash).
      # So start, assert and stop all have to live in a single step.
      #
      # A loose system binary stands in for a game EXE: small enough to import in seconds,
      # and it exercises the same load path. Real game binaries belong in the pipeline.
      - name: Headless server -- start, assert it is useful, bridge, stop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:8089'

          Write-Host '::group::-Start'
          $target = "$env:RUNNER_TEMP\subject.exe"
          Copy-Item C:\Windows\System32\where.exe $target -Force
          # -WriteMcpConfigTo is the generator users are told produces their .mcp.json with the
          # paths resolved for this machine, and no workflow had ever invoked it: a wrong bridge
          # path or a port pinned to a server that is not there shipped green, and its first
          # symptom is an agent session with no Ghidra tools in it -- the very contract this job
          # exists to prove. An empty directory, so this takes the WRITE branch; the second
          # -Start below takes the COMPARE branch against the file it leaves.
          $cfgDir = "$env:RUNNER_TEMP\mcpcfg"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          .\setup\36-ghidra-mcp.ps1 -Start -File $target -TimeoutSec 600 -WriteMcpConfigTo $cfgDir
          if ($LASTEXITCODE -ne 0) { throw "-Start reported failure (exit $LASTEXITCODE)." }
          Write-Host '::endgroup::'

          Write-Host '::group::endpoints'
          $conn = (Invoke-WebRequest "$base/check_connection" -UseBasicParsing -TimeoutSec 30).Content.Trim()
          Write-Host "check_connection : $conn"

          # /mcp/schema answers {"tools":[...],"count":N} -- NOT the {"data":...} envelope
          # other endpoints use. Reading .data here silently yields 0, which is exactly the
          # bug that made 36-ghidra-mcp.ps1 once report "0 tools" against a healthy server.
          $schema = (Invoke-WebRequest "$base/mcp/schema" -UseBasicParsing -TimeoutSec 60).Content | ConvertFrom-Json
          $tools = if ($null -ne $schema.count) { [int]$schema.count } else { @($schema.tools).Count }
          Write-Host "mcp tools        : $tools"
          if ($tools -lt 100) { throw "Only $tools tools exposed; expected the full endpoint set." }

          $meta = (Invoke-WebRequest "$base/get_metadata" -UseBasicParsing -TimeoutSec 60).Content
          Write-Host "get_metadata     : $meta"
          if ($meta -match 'No program loaded') { throw 'Server is up but no program is loaded.' }
          $fnCount = ($meta | ConvertFrom-Json).function_count
          if (-not $fnCount -or $fnCount -lt 1) { throw "Program loaded but function_count=$fnCount." }

          # Prove analysis output is reachable, not just that the program opened.
          $fns = (Invoke-WebRequest "$base/list_functions" -UseBasicParsing -TimeoutSec 120).Content | ConvertFrom-Json
          $first = @($fns.functions)[0]
          if (-not $first.name) { throw 'list_functions returned nothing usable.' }
          Write-Host "first function   : $($first.name) @ $($first.address)"

          $dec = (Invoke-WebRequest "$base/decompile_function?address=0x$($first.address)" -UseBasicParsing -TimeoutSec 120).Content | ConvertFrom-Json
          if (-not $dec.decompiled) { throw "decompile_function returned no code for $($first.address)." }
          Write-Host "decompiled ok    : $($dec.decompiled.Length) chars"
          Write-Host '::endgroup::'

          Write-Host '::group::the .mcp.json an agent would load'
          $cfgPath = Join-Path $cfgDir '.mcp.json'
          if (-not (Test-Path $cfgPath)) { throw "-WriteMcpConfigTo produced no $cfgPath." }
          # A UTF-8 BOM in front of the opening brace is enough on its own for a client to read
          # NO servers at all, and 5.1's Set-Content -Encoding UTF8 writes one -- which is why
          # the generator uses [IO.File]::WriteAllText. It has to be read as BYTES to see it:
          # measured on 5.1, `Get-Content -Raw -Encoding UTF8` STRIPS the U+FEFF before
          # ConvertFrom-Json is ever handed the text, so a BOM'd config parses perfectly. This
          # step used to assert the BOM guarantee by parsing, which cannot fail either way.
          $rawBytes = [IO.File]::ReadAllBytes($cfgPath)
          if ($rawBytes.Length -ge 3 -and $rawBytes[0] -eq 0xEF -and $rawBytes[1] -eq 0xBB -and $rawBytes[2] -eq 0xBF) {
              throw "$cfgPath starts with a UTF-8 BOM. An MCP client's JSON parser rejects it and loads no servers at all."
          }
          # Now parse it the way an MCP client does.
          $cfg = Get-Content $cfgPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $names = @($cfg.mcpServers.PSObject.Properties.Name)
          Write-Host "servers        : $($names -join ', ')"
          # BOTH servers. The inline builder this generator replaced left x64dbg out of every
          # config 36-ghidra-mcp.ps1 wrote, while mcp\mcp.template.json (which New-Plugin.ps1
          # copied) carried both and a hard-coded C:/repos bridge path -- each file was the fix
          # for the other one's bug. Asserting one server would re-open half of that.
          foreach ($want in 'ghidra', 'x64dbg') {
              if ($names -notcontains $want) { throw "$cfgPath has no '$want' server (found: $($names -join ', '))." }
          }
          $cmd = "$($cfg.mcpServers.ghidra.command)"
          $cfgUrl = "$($cfg.mcpServers.ghidra.env.GHIDRA_MCP_URL)"
          $x64 = (@($cfg.mcpServers.x64dbg.args) -join ' ')
          Write-Host "ghidra command : $cmd"
          Write-Host "GHIDRA_MCP_URL : $cfgUrl"
          Write-Host "x64dbg args    : $x64"
          # The command has to be a bridge that is actually on this machine: the failure being
          # closed is a config naming C:\repos\ghidra-mcp on a machine whose repos live
          # elsewhere, which spawns nothing and says nothing.
          if (-not (Test-Path $cmd)) { throw "the ghidra command in $cfgPath is not on this machine: $cmd" }
          # ...and it has to be the path 30-ghidra.ps1 RECORDED, not New-McpConfigObject's
          # hard-coded C:\repos\ghidra-mcp fallback. Test-Path alone cannot tell those two apart
          # HERE, and only here: 30-ghidra.ps1's -GhidraMcpDir default is C:\repos\ghidra-mcp,
          # which is exactly where the step above cloned it, so on this runner the guess and the
          # truth are the same string. A manifest that had lost its bridgeExe -- the very case
          # the generator prints a warning for -- would then ship green through a check whose
          # whole subject is that path. Hold it against the manifest instead.
          $recordedBridge = "$((Get-Content .\setup\.ghidra-mcp-build.json -Raw -Encoding UTF8 | ConvertFrom-Json).bridgeExe)".Trim()
          Write-Host "manifest bridge: $recordedBridge"
          if (-not $recordedBridge) { throw 'setup\.ghidra-mcp-build.json records no bridgeExe, so anything in the config can only be a guess.' }
          if (($cmd -replace '/', '\') -ne ($recordedBridge -replace '/', '\')) {
              throw "the config names $cmd; 30-ghidra.ps1 recorded $recordedBridge. The generator fell back to its C:\repos guess."
          }
          # And the URL has to name the port THIS run served on. 36-ghidra-mcp.ps1 documents
          # -Port for a machine where 8089 is busy, and a config generated with the default then
          # pins the bridge to a port nothing is listening on.
          if ($cfgUrl.TrimEnd('/') -ne $base) { throw "the config pins $cfgUrl; this run served $base." }
          # A version-pinned npx spec, because an unpinned x64dbg-mcp-server resolves to whatever
          # is newest and fails at the handshake against the pinned .dp64, inside a session.
          if ($x64 -notmatch 'x64dbg-mcp-server@\d+\.\d+\.\d+') { throw "the x64dbg server is not version-pinned: $x64" }
          Write-Host '::endgroup::'

          # The REST endpoints answering is NOT the same as an agent getting tools; the
          # bridge is what turns them into MCP tools. This is that contract -- and it is driven
          # from the FILE rather than from $base, because the file is what a session loads: a
          # URL that is right in this job and wrong in the config is the failure worth catching.
          Write-Host '::group::bridge registers tools'
          $py = Join-Path (Split-Path $cmd -Parent) 'python.exe'
          if (-not (Test-Path $py)) { throw "no python.exe beside the bridge named in $cfgPath ($py) -- that command cannot spawn." }
          & $py .github\scripts\probe_bridge.py $cfgUrl
          if ($LASTEXITCODE -ne 0) { throw "probe_bridge.py failed (exit $LASTEXITCODE)." }
          Write-Host '::endgroup::'

          # Twice. A second -Start against a server that is already up takes the "Already
          # running" path, and that path has to re-check three things rather than exit early:
          # the tool count, the program loaded against the -File asked for, and the .mcp.json --
          # now through the COMPARE branch, holding the file written above against what this run
          # would write. Exit 0 is the generator agreeing with its own comparator; anything else
          # is 2. That branch used to print the JSON, say "merge this in yourself" and exit 0
          # without reading the file at all.
          Write-Host '::group::-Start again (idempotence, and the compare branch)'
          $cfgHash = (Get-FileHash $cfgPath -Algorithm SHA256).Hash
          .\setup\36-ghidra-mcp.ps1 -Start -File $target -TimeoutSec 600 -WriteMcpConfigTo $cfgDir
          if ($LASTEXITCODE -ne 0) { throw "the second -Start exited $LASTEXITCODE (expected 0: same server, same program, same config)." }
          if ((Get-FileHash $cfgPath -Algorithm SHA256).Hash -ne $cfgHash) {
              Get-Content $cfgPath -Encoding UTF8
              throw 'the second -Start rewrote a matching .mcp.json; the compare branch must leave it alone.'
          }
          Write-Host '::endgroup::'

          Write-Host '::group::-Status / -Stop'
          # Gate on -Status, do not merely run it. CLAUDE.md states the Phase 4 gate as a live
          # connection AND a non-zero tool count AND a loaded program, and 36 enforces all three
          # by exit code now. Left unchecked, that code was overwritten by the -Stop below before
          # anything read it, so the one assertion this leg exists to make was discarded -- the
          # same muted-alarm shape the probe_bridge tool floor was fixed for.
          .\setup\36-ghidra-mcp.ps1 -Status
          if ($LASTEXITCODE -ne 0) { throw "-Status did not meet the documented Phase 4 gate (exit $LASTEXITCODE)." }
          .\setup\36-ghidra-mcp.ps1 -Stop
          if ($LASTEXITCODE -ne 0) { throw "-Stop reported failure (exit $LASTEXITCODE)." }
          Start-Sleep -Seconds 3
          # A JVM left alive is what strands a project lock and blocks every later run.
          $alive = @(Get-Process java, javaw -ErrorAction SilentlyContinue)
          if ($alive.Count) {
              $alive | Format-Table Id, ProcessName -AutoSize | Out-String | Write-Host
              throw "-Stop left $($alive.Count) JVM(s) running."
          }
          # And the port must be free, or the next -Start refuses.
          if (@(Get-NetTCPConnection -LocalPort 8089 -State Listen -ErrorAction SilentlyContinue).Count) {
              throw 'Port 8089 is still bound after -Stop.'
          }
          Write-Host 'Stopped cleanly: no JVM, port free.'
          Write-Host '::endgroup::'

      # ---------------------------------------------------------------- x64dbg
      # 40-x64dbg.ps1 was never executed by any workflow: the snapshot flatten, the install
      # receipt and the size-checked plugin download all shipped on the strength of a parse,
      # while .mcp.json's second server -- asserted above -- points at the very plugin this
      # installs. -InstallDir and -BgsRoot both land in RUNNER_TEMP, so nothing here goes near
      # C:\tools.
      #
      # GH_TOKEN is passed because both of this script's release lookups go to the GitHub API,
      # and unauthenticated that API allows 60 requests per hour PER IP -- an IP this runner
      # shares with every other job on its Azure host. This leg failed exactly that way on its
      # first real run ("API rate limit exceeded for 48.214.54.98"), red through no fault of
      # this repository. Authenticated it is 1000/hour for the repo. The script reads the token
      # rather than requiring it, so a developer with no GitHub account still gets today's
      # behaviour; a documented-flaky check would have been the worse answer, because a job that
      # goes red at random teaches its readers to stop believing red at all.
      - name: 40-x64dbg.ps1 -- install, re-run, then repair a tree broken on purpose
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dbg = "$env:RUNNER_TEMP\x64dbg"
          # No BethesdaGhidraScripts clone here (it is huge and needs game EXEs), so step 3 of
          # that script has to report where it looked instead of prescribing hours of
          # re-analysis -- and it must still exit 0, because a missing symbol export is not a
          # failed x64dbg install.
          $bgs = "$env:RUNNER_TEMP\no-such-bgs"

          Write-Host '::group::first run (installs)'
          .\setup\40-x64dbg.ps1 -InstallDir $dbg -BgsRoot $bgs
          if ($LASTEXITCODE -ne 0) { throw "40-x64dbg.ps1 exited $LASTEXITCODE." }
          $launcher = Join-Path $dbg 'x96dbg.exe'
          $engine = Join-Path $dbg 'x64\x64dbg.exe'
          $plugin = Join-Path $dbg 'x64\plugins\x64dbg_mcp.dp64'
          $receiptPath = Join-Path $dbg '.starter-pack-install.json'
          foreach ($p in @($launcher, $engine, $plugin, $receiptPath)) {
              if (-not (Test-Path $p)) { throw "missing after a run that reported success: $p" }
          }
          # x96dbg.exe is only the ~199 KB picker; without x64\x64dbg.exe beside it the tree
          # cannot debug a single 64-bit target, and 90-verify's plugin row passes on the .dp64
          # alone -- so the engine is asserted here rather than assumed from the launcher.
          $receipt = Get-Content $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $receipt | Format-List
          if ($receipt.preExisting -ne $false) { throw 'the receipt calls this tree pre-existing; this run created it, and only a pack-owned tree may be repaired.' }
          if (-not $receipt.mcpVersion) { throw 'the receipt records no mcpVersion -- every release ships the .dp64 under the same name, so nothing else can say which one is on disk.' }
          Write-Host '::endgroup::'

          Write-Host '::group::second run (must change nothing)'
          $before = (Get-FileHash $receiptPath -Algorithm SHA256).Hash
          $pluginSize = (Get-Item $plugin).Length
          .\setup\40-x64dbg.ps1 -InstallDir $dbg -BgsRoot $bgs
          if ($LASTEXITCODE -ne 0) { throw "the second run exited $LASTEXITCODE." }
          if ((Get-FileHash $receiptPath -Algorithm SHA256).Hash -ne $before) {
              Get-Content $receiptPath -Encoding UTF8
              throw 'the second run rewrote the receipt though nothing it records had changed; its "at" is meant to say when this state came to be.'
          }
          if ((Get-Item $plugin).Length -ne $pluginSize) { throw 're-run replaced a plugin it had just verified.' }
          Write-Host "receipt unchanged (sha256 $before), plugin still $pluginSize bytes"
          Write-Host '::endgroup::'

          Write-Host '::group::mutate, then repair'
          # The one leg that would have caught the Move-Item defect found in this batch: on a
          # tree that already had x64\ and x32\, the repair threw "Cannot create a file when
          # that file already exists", exited 1, left the engine still missing AND a stray
          # release\ inside the install dir, and a re-run reproduced it exactly -- the tree came
          # out worse than it went in. Both mutations below are things that really happen:
          # Defender quarantines x64\x64dbg.exe, and an interrupted download leaves the front
          # half of a .dp64 that x64dbg then refuses to load.
          Remove-Item $engine -Force
          Set-Content $plugin -Value 'truncated' -Encoding ascii
          .\setup\40-x64dbg.ps1 -InstallDir $dbg -BgsRoot $bgs
          if ($LASTEXITCODE -ne 0) { throw "the repair run exited $LASTEXITCODE -- a tree this pack's own receipt claims it created has to be repairable." }
          if (-not (Test-Path $engine)) { throw "$engine was not restored." }
          $now = (Get-Item $plugin).Length
          if ($now -ne $pluginSize) { throw "the truncated plugin is $now bytes; the release publishes $pluginSize." }
          if (Test-Path (Join-Path $dbg 'release')) { throw "the flatten left a release\ directory inside $dbg." }
          Write-Host 'Repaired: engine back, plugin back to its published size, no stray release\.'
          Write-Host '::endgroup::'
          exit 0

      # ---------------------------------------------------------------- error paths
      # These are contracts an agent depends on: a script that fails clearly is the
      # difference between "stage your EXEs" and an unattended run guessing.
      - name: Scripts must fail clearly when their inputs are absent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # BethesdaGhidraScripts is not cloned here (it is huge and needs game EXEs anyway),
          # so 35-ghidra-analysis.ps1 must say so rather than half-run.
          $threw = $false
          try { .\setup\35-ghidra-analysis.ps1 -CheckOnly -BgsRoot 'C:\nope\not-here' }
          catch { $threw = $true; Write-Host "expected throw: $_" }
          if (-not $threw) { throw '35-ghidra-analysis.ps1 -CheckOnly did not fail on a missing BgsRoot.' }

          # And -Start must refuse rather than run against a build that was never made.
          Remove-Item .\setup\.ghidra-mcp-build.json -Force
          $threw = $false
          try { .\setup\36-ghidra-mcp.ps1 -Start }
          catch { $threw = $true; Write-Host "expected throw: $_" }
          if (-not $threw) { throw '36-ghidra-mcp.ps1 -Start did not fail with no build manifest.' }
          Write-Host 'Both scripts failed clearly.'

      - name: Summary
        if: always()
        shell: powershell
        run: |
          $lines = @(
            "## Ghidra MCP bringup - ${{ matrix.ghidra }}",
            '',
            '| | |',
            '|---|---|',
            "| Ghidra | ${{ steps.rel.outputs.version }} (``${{ steps.rel.outputs.asset }}``) |",
            "| Result | ${{ job.status }} |",
            "| Gating | yes - a failure here blocks the push or PR |"
          )
          $lines -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Server logs on failure
        if: failure()
        shell: powershell
        run: |
          foreach ($f in '.\setup\.ghidra-headless.out.log', '.\setup\.ghidra-headless.err.log') {
              if (Test-Path $f) {
                  Write-Host "=== $f ==="
                  Get-Content $f -Tail 60
              }
          }
