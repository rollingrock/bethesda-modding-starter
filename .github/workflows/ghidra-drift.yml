name: Ghidra drift detector

# This is the Phase 4 bringup from ghidra-bringup.yml, re-run against Ghidra's LATEST
# release instead of the pinned 12.0.4 this pack is verified against. Its job is to find out
# that a new Ghidra broke ghidra-mcp's compile, or the version gate, or the headless
# server, on a Monday morning here -- rather than on a user's fresh machine, where the
# symptom is an extension Ghidra silently refuses to load. It skips two things, and only
# because neither can drift with a Ghidra release: the error-path assertions, which are about
# how this pack's own scripts report missing inputs, and the 40-x64dbg.ps1 install-and-repair
# leg, which touches no Ghidra at all and would spend the weekly run's bandwidth re-proving
# ghidra-bringup.yml's answer. Everything a new Ghidra CAN break is here, twice where the
# pinned run does it twice.
#
# WHY THIS IS A SEPARATE FILE and not a second matrix leg in ghidra-bringup.yml: as a leg
# it needed continue-on-error, because a Ghidra release that ghidra-mcp has not caught up
# with yet must never block an unrelated PR. But continue-on-error makes a leg incapable of
# failing the RUN, and a failed run conclusion is the only thing GitHub sends mail about --
# so the detector detected and told nobody: it wrote the breakage into a step summary
# inside a green run that nobody opens. Split out, it fails on its own and that failure is
# the notification, with no gh-issue machinery needed; and it still cannot block a PR,
# because it has no push or pull_request trigger at all. That is the entire point of the
# split, so two things must stay true of this file: nothing in it may carry
# continue-on-error, and no push/pull_request trigger belongs in it.
#
# The step duplication with ghidra-bringup.yml is deliberate. These two are expected to
# drift apart -- this one may need a workaround for an unreleased Ghidra that must never
# reach the run that gates PRs -- and a reusable-workflow indirection would make the gating
# path harder to read for no benefit at this size.
on:
  schedule:
    # Mondays 06:00 UTC -- catches a new Ghidra release without anyone pushing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift check (Ghidra latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Ghidra 12 and the GhidraMCP build both need JDK 21+. Pin it rather than inherit
      # whatever the image ships, so a runner-image bump cannot silently change the JDK.
      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve the Ghidra release to install
        id: rel
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'bethesda-modding-starter-ci' }
          $api = 'https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100'
          $releases = Invoke-RestMethod $api -Headers $headers
          # Newest real release. Prereleases and drafts are excluded on purpose: drifting
          # against something users cannot install would report breakage nobody can hit.
          $rel = $releases | Where-Object { -not $_.prerelease -and -not $_.draft } | Select-Object -First 1
          if (-not $rel) { throw 'The Ghidra releases API returned no published release.' }
          $asset = $rel.assets | Where-Object { $_.name -like 'ghidra_*_PUBLIC_*.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Release $($rel.tag_name) has no ghidra_*_PUBLIC_*.zip asset." }
          # ghidra_12.0.4_PUBLIC_20260303.zip -> version 12.0.4, extracted dir ghidra_12.0.4_PUBLIC
          if ($asset.name -notmatch '^ghidra_([0-9.]+)_PUBLIC_') { throw "Cannot parse a version out of $($asset.name)." }
          $ver = $Matches[1]
          Write-Host "release  : $($rel.tag_name)"
          Write-Host "asset    : $($asset.name)  ($([math]::Round($asset.size/1MB)) MB)"
          Write-Host "version  : $ver"
          "version=$ver"              | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=$($asset.name)"      | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($asset.browser_download_url)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dir=C:\tools\ghidra_${ver}_PUBLIC"  | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ~400 MB per download; cache it so this weekly run is cheap while Ghidra's latest
      # release stays put. The key is the asset name, so the week a new one ships this
      # misses and re-downloads, which is exactly the week we want a real download anyway.
      - name: Cache the Ghidra install
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.rel.outputs.dir }}
          key: ghidra-${{ steps.rel.outputs.asset }}

      - name: Download + extract Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP '${{ steps.rel.outputs.asset }}'
          Write-Host 'Downloading ...'
          # Invoke-WebRequest's progress rendering costs minutes on a 400 MB file in CI.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest '${{ steps.rel.outputs.url }}' -OutFile $zip
          Write-Host 'Extracting ...'
          Expand-Archive $zip -DestinationPath C:\tools -Force
          Remove-Item $zip

      - name: Confirm the install looks like Ghidra
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $props = '${{ steps.rel.outputs.dir }}\Ghidra\application.properties'
          if (-not (Test-Path $props)) { throw "No application.properties under ${{ steps.rel.outputs.dir }}" }
          Get-Content $props | Select-String 'application.version|application.release.name'

      # ---------------------------------------------------------------- the pack's own script
      # 20-repos.ps1 rather than a hand-rolled clone, for the reason spelled out in
      # ghidra-bringup.yml: 30-ghidra.ps1 below REFUSES to clone and points at this script, so a
      # workflow that cloned for itself left the one place that pins the fork and the branch
      # with no execution coverage at all. -Only keeps vr_address_tools (~1.1 GB) out of it.
      - name: 20-repos.ps1 -Only ghidra-mcp (the script that pins the fork)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -CheckOnly first, on an empty C:\repos: 2 is "work pending", and it is the only
          # answer that proves this run really cloned something rather than finding it.
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp -CheckOnly
          if ($LASTEXITCODE -ne 2) { throw "-CheckOnly on an empty C:\repos exited $LASTEXITCODE; expected 2 (work pending)." }
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp
          if ($LASTEXITCODE -ne 0) { throw "20-repos.ps1 failed (exit $LASTEXITCODE)." }
          # Twice, the same as the pinned run: the second one must adopt the clone on identity
          # and exit 0 without re-cloning or deleting anything.
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp
          if ($LASTEXITCODE -ne 0) { throw "the second 20-repos.ps1 run exited $LASTEXITCODE." }
          .\setup\20-repos.ps1 -Root C:\repos -Only ghidra-mcp -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "-CheckOnly over the fresh clone exited $LASTEXITCODE; expected 0." }
          $origin = & git -C C:\repos\ghidra-mcp remote get-url origin
          if ($origin -ne 'https://github.com/bethington/ghidra-mcp.git') { throw "ghidra-mcp origin is $origin" }
          Write-Host "ghidra-mcp @ $(git -C C:\repos\ghidra-mcp rev-parse --short HEAD) from $origin"
          exit 0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/ghidra-drift.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------------------------------------------------------------- build the extension
      # This is the step drift usually breaks: GhidraMCP compiles against Ghidra's own jars,
      # so a new release that moves or renames an API fails the build here.
      - name: 30-ghidra.ps1 (build + deploy the extension, create the bridge venv)
        shell: powershell
        run: .\setup\30-ghidra.ps1 -GhidraPath '${{ steps.rel.outputs.dir }}'

      - name: Assert what 30-ghidra.ps1 claims it produced
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\setup\.ghidra-mcp-build.json'
          if (-not (Test-Path $manifest)) { throw 'No setup\.ghidra-mcp-build.json -- 30-ghidra.ps1 did not finish.' }
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          $m | Format-List

          # The version gate is the failure that produces an extension Ghidra silently will
          # not load, so assert it here too rather than trusting the script's own check.
          if ($m.ghidraVersion -ne '${{ steps.rel.outputs.version }}') {
              throw "Manifest says Ghidra $($m.ghidraVersion), we installed ${{ steps.rel.outputs.version }}."
          }
          foreach ($p in @($m.pluginJar, $m.bridgeExe, $m.headlessCpFile, $m.extensionZip)) {
              if (-not (Test-Path $p)) { throw "Missing artifact: $p" }
          }
          # The headless server cannot start without a real classpath; an empty or tiny
          # argfile is the kind of thing that only shows up as a NoClassDefFoundError later.
          $jars = ((Get-Content $m.headlessCpFile -Raw) -split ';').Count
          Write-Host "classpath entries: $jars"
          if ($jars -lt 50) { throw "Classpath argfile has only $jars entries; expected the full Ghidra jar set." }
          Write-Host 'All artifacts present.'

      # SECOND RUN, same as ghidra-bringup.yml: 30-ghidra.ps1 writes its manifest only when a
      # field it records has changed, so a re-run over an unchanged build must leave those bytes
      # exactly as they were. Here it carries one extra question the pinned run cannot ask --
      # whether a NEW Ghidra makes the second run pick something different (a renamed profile
      # directory, a second install in ToolsDir) and rewrite the manifest under a build nothing
      # rebuilt.
      - name: 30-ghidra.ps1 again -- a re-run must change nothing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\setup\.ghidra-mcp-build.json'
          $before = (Get-FileHash $manifest -Algorithm SHA256).Hash
          .\setup\30-ghidra.ps1 -GhidraPath '${{ steps.rel.outputs.dir }}'
          if ($LASTEXITCODE -ne 0) { throw "the second 30-ghidra.ps1 run exited $LASTEXITCODE." }
          $after = (Get-FileHash $manifest -Algorithm SHA256).Hash
          if ($after -ne $before) {
              Write-Host "before: $before"
              Write-Host "after : $after"
              Get-Content $manifest -Encoding UTF8
              throw 'The second run rewrote setup\.ghidra-mcp-build.json. A re-run over an unchanged build must leave it byte-identical.'
          }
          Write-Host "Manifest unchanged across two runs (sha256 $before)."
          exit 0

      # ---------------------------------------------------------------- headless server
      # ONE step on purpose. A background process does NOT survive the step that started
      # it on a Windows runner -- the runner tears down the step's process tree, so a
      # server started in step N is already gone in step N+1. Measured: -Start reported
      # "HTTP server started on 127.0.0.1:8089" and the very next step got "Unable to
      # connect to the remote server", with the server's own log ending cleanly (no crash).
      # So start, assert and stop all have to live in a single step.
      #
      # A loose system binary stands in for a game EXE: small enough to import in seconds,
      # and it exercises the same load path. Real game binaries belong in the pipeline.
      - name: Headless server -- start, assert it is useful, bridge, stop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:8089'

          Write-Host '::group::-Start'
          $target = "$env:RUNNER_TEMP\subject.exe"
          Copy-Item C:\Windows\System32\where.exe $target -Force
          # -WriteMcpConfigTo, the same as the pinned run: the generated .mcp.json names the
          # bridge exe 30-ghidra.ps1 recorded, and a new Ghidra is exactly what moves that path
          # (a changed profile directory, a rebuilt venv) without anything else noticing.
          $cfgDir = "$env:RUNNER_TEMP\mcpcfg"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          .\setup\36-ghidra-mcp.ps1 -Start -File $target -TimeoutSec 600 -WriteMcpConfigTo $cfgDir
          if ($LASTEXITCODE -ne 0) { throw "-Start reported failure (exit $LASTEXITCODE)." }
          Write-Host '::endgroup::'

          Write-Host '::group::endpoints'
          $conn = (Invoke-WebRequest "$base/check_connection" -UseBasicParsing -TimeoutSec 30).Content.Trim()
          Write-Host "check_connection : $conn"

          # /mcp/schema answers {"tools":[...],"count":N} -- NOT the {"data":...} envelope
          # other endpoints use. Reading .data here silently yields 0, which is exactly the
          # bug that made 36-ghidra-mcp.ps1 once report "0 tools" against a healthy server.
          $schema = (Invoke-WebRequest "$base/mcp/schema" -UseBasicParsing -TimeoutSec 60).Content | ConvertFrom-Json
          $tools = if ($null -ne $schema.count) { [int]$schema.count } else { @($schema.tools).Count }
          Write-Host "mcp tools        : $tools"
          if ($tools -lt 100) { throw "Only $tools tools exposed; expected the full endpoint set." }

          $meta = (Invoke-WebRequest "$base/get_metadata" -UseBasicParsing -TimeoutSec 60).Content
          Write-Host "get_metadata     : $meta"
          if ($meta -match 'No program loaded') { throw 'Server is up but no program is loaded.' }
          $fnCount = ($meta | ConvertFrom-Json).function_count
          if (-not $fnCount -or $fnCount -lt 1) { throw "Program loaded but function_count=$fnCount." }

          # Prove analysis output is reachable, not just that the program opened.
          $fns = (Invoke-WebRequest "$base/list_functions" -UseBasicParsing -TimeoutSec 120).Content | ConvertFrom-Json
          $first = @($fns.functions)[0]
          if (-not $first.name) { throw 'list_functions returned nothing usable.' }
          Write-Host "first function   : $($first.name) @ $($first.address)"

          $dec = (Invoke-WebRequest "$base/decompile_function?address=0x$($first.address)" -UseBasicParsing -TimeoutSec 120).Content | ConvertFrom-Json
          if (-not $dec.decompiled) { throw "decompile_function returned no code for $($first.address)." }
          Write-Host "decompiled ok    : $($dec.decompiled.Length) chars"
          Write-Host '::endgroup::'

          Write-Host '::group::the .mcp.json an agent would load'
          $cfgPath = Join-Path $cfgDir '.mcp.json'
          if (-not (Test-Path $cfgPath)) { throw "-WriteMcpConfigTo produced no $cfgPath." }
          # The BOM read as BYTES, because 5.1's Get-Content -Encoding UTF8 strips a U+FEFF
          # before ConvertFrom-Json sees it -- parsing can never catch the thing a BOM breaks.
          # See ghidra-bringup.yml for the measurement and for what each check below used to
          # ship broken.
          $rawBytes = [IO.File]::ReadAllBytes($cfgPath)
          if ($rawBytes.Length -ge 3 -and $rawBytes[0] -eq 0xEF -and $rawBytes[1] -eq 0xBB -and $rawBytes[2] -eq 0xBF) {
              throw "$cfgPath starts with a UTF-8 BOM. An MCP client's JSON parser rejects it and loads no servers at all."
          }
          # Then parsed the way an MCP client parses it, and held to what the generator exists
          # to get right.
          $cfg = Get-Content $cfgPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $names = @($cfg.mcpServers.PSObject.Properties.Name)
          Write-Host "servers        : $($names -join ', ')"
          foreach ($want in 'ghidra', 'x64dbg') {
              if ($names -notcontains $want) { throw "$cfgPath has no '$want' server (found: $($names -join ', '))." }
          }
          $cmd = "$($cfg.mcpServers.ghidra.command)"
          $cfgUrl = "$($cfg.mcpServers.ghidra.env.GHIDRA_MCP_URL)"
          $x64 = (@($cfg.mcpServers.x64dbg.args) -join ' ')
          Write-Host "ghidra command : $cmd"
          Write-Host "GHIDRA_MCP_URL : $cfgUrl"
          Write-Host "x64dbg args    : $x64"
          if (-not (Test-Path $cmd)) { throw "the ghidra command in $cfgPath is not on this machine: $cmd" }
          # Test-Path cannot tell the recorded path from the generator's C:\repos\ghidra-mcp
          # fallback on this runner -- they are the same string here -- so hold it against the
          # manifest, which is the only thing that says the config was GENERATED rather than
          # guessed. A new Ghidra moving the bridge (a renamed profile, a rebuilt venv) is
          # exactly the drift this workflow is for.
          $recordedBridge = "$((Get-Content .\setup\.ghidra-mcp-build.json -Raw -Encoding UTF8 | ConvertFrom-Json).bridgeExe)".Trim()
          Write-Host "manifest bridge: $recordedBridge"
          if (-not $recordedBridge) { throw 'setup\.ghidra-mcp-build.json records no bridgeExe, so anything in the config can only be a guess.' }
          if (($cmd -replace '/', '\') -ne ($recordedBridge -replace '/', '\')) {
              throw "the config names $cmd; 30-ghidra.ps1 recorded $recordedBridge. The generator fell back to its C:\repos guess."
          }
          if ($cfgUrl.TrimEnd('/') -ne $base) { throw "the config pins $cfgUrl; this run served $base." }
          if ($x64 -notmatch 'x64dbg-mcp-server@\d+\.\d+\.\d+') { throw "the x64dbg server is not version-pinned: $x64" }
          Write-Host '::endgroup::'

          # The REST endpoints answering is NOT the same as an agent getting tools; the
          # bridge is what turns them into MCP tools. This is that contract, driven from the
          # FILE rather than from $base, because the file is what a session actually loads.
          Write-Host '::group::bridge registers tools'
          $py = Join-Path (Split-Path $cmd -Parent) 'python.exe'
          if (-not (Test-Path $py)) { throw "no python.exe beside the bridge named in $cfgPath ($py) -- that command cannot spawn." }
          & $py .github\scripts\probe_bridge.py $cfgUrl
          if ($LASTEXITCODE -ne 0) { throw "probe_bridge.py failed (exit $LASTEXITCODE)." }
          Write-Host '::endgroup::'

          # Twice. The "Already running" path re-checks the tool count, the loaded program and
          # the .mcp.json through its COMPARE branch; exit 0 is the generator agreeing with its
          # own comparator. See the same block in ghidra-bringup.yml.
          Write-Host '::group::-Start again (idempotence, and the compare branch)'
          $cfgHash = (Get-FileHash $cfgPath -Algorithm SHA256).Hash
          .\setup\36-ghidra-mcp.ps1 -Start -File $target -TimeoutSec 600 -WriteMcpConfigTo $cfgDir
          if ($LASTEXITCODE -ne 0) { throw "the second -Start exited $LASTEXITCODE (expected 0: same server, same program, same config)." }
          if ((Get-FileHash $cfgPath -Algorithm SHA256).Hash -ne $cfgHash) {
              Get-Content $cfgPath -Encoding UTF8
              throw 'the second -Start rewrote a matching .mcp.json; the compare branch must leave it alone.'
          }
          Write-Host '::endgroup::'

          Write-Host '::group::-Status / -Stop'
          # Gate on -Status, do not merely run it -- see the same block in ghidra-bringup.yml.
          # Unchecked, this exit code was overwritten by the -Stop below before anything read it.
          .\setup\36-ghidra-mcp.ps1 -Status
          if ($LASTEXITCODE -ne 0) { throw "-Status did not meet the documented Phase 4 gate (exit $LASTEXITCODE)." }
          .\setup\36-ghidra-mcp.ps1 -Stop
          if ($LASTEXITCODE -ne 0) { throw "-Stop reported failure (exit $LASTEXITCODE)." }
          Start-Sleep -Seconds 3
          # A JVM left alive is what strands a project lock and blocks every later run.
          $alive = @(Get-Process java, javaw -ErrorAction SilentlyContinue)
          if ($alive.Count) {
              $alive | Format-Table Id, ProcessName -AutoSize | Out-String | Write-Host
              throw "-Stop left $($alive.Count) JVM(s) running."
          }
          # And the port must be free, or the next -Start refuses.
          if (@(Get-NetTCPConnection -LocalPort 8089 -State Listen -ErrorAction SilentlyContinue).Count) {
              throw 'Port 8089 is still bound after -Stop.'
          }
          Write-Host 'Stopped cleanly: no JVM, port free.'
          Write-Host '::endgroup::'

      - name: Summary
        if: always()
        shell: powershell
        run: |
          $lines = @(
            "## Ghidra MCP drift check - latest (${{ steps.rel.outputs.version }})",
            '',
            '| | |',
            '|---|---|',
            "| Ghidra | ${{ steps.rel.outputs.version }} (``${{ steps.rel.outputs.asset }}``) |",
            "| Result | ${{ job.status }} |",
            "| Gating | no - this blocks no PR, but a red run here is the notification |"
          )
          $lines -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Server logs on failure
        if: failure()
        shell: powershell
        run: |
          foreach ($f in '.\setup\.ghidra-headless.out.log', '.\setup\.ghidra-headless.err.log') {
              if (Test-Path $f) {
                  Write-Host "=== $f ==="
                  Get-Content $f -Tail 60
              }
          }
